name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Descargar Alex's Mobs y Jade (Modrinth, 1.20.1 Forge)
        run: |
          set -euo pipefail
          UA="capitan-salchichon/alexs-egg-timer (github actions)"
          fetch() {
            local slug="$1" out="$2" url
            url=$(curl -fsSL -A "$UA" \
              "https://api.modrinth.com/v2/project/${slug}/version?game_versions=%5B%221.20.1%22%5D&loaders=%5B%22forge%22%5D" \
              | jq -r '([.[] | select(.version_type=="release")] + .)[0].files | (map(select(.primary))[0] // .[0]).url')
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "No se encontró ${slug} para 1.20.1 Forge en Modrinth" >&2
              exit 1
            fi
            echo "${slug}: ${url}"
            curl -fsSL -A "$UA" -o "libs/${out}" "$url"
          }
          fetch alexs-mobs alexsmobs-1.0.jar
          fetch jade jade-1.0.jar
          ls -la libs

      - name: Compilar
        run: ./gradlew build --no-daemon

      - name: Crear release con el jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' -e '-slim' | head -1)
          echo "Publicando $JAR como $TAG"
          gh release create "$TAG" "$JAR" \
            --title "Alex's Egg Timer $TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
