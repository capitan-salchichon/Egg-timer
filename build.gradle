plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = 'com.brochacho.eggtimer'
version = mod_version
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '-mixin.config=alexs_egg_timer.mixins.json'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, 'alexs_egg_timer.refmap.json'
    config 'alexs_egg_timer.mixins.json'
}

repositories {
    mavenCentral()
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // jars locales: coloca alexsmobs-1.0.jar y jade-1.0.jar en ./libs
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Citadel (requerido por Alex's Mobs) - mismo archivo que usa el repo de Alex's Mobs
    implementation fg.deobf('curse.maven:citadel-331936:5633260')

    // Estos dos los pones tú en ./libs (ver README)
    implementation fg.deobf('local:alexsmobs:1.0')
    implementation fg.deobf('local:jade:1.0')
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title'     : mod_id,
        'Specification-Version'   : '1',
        'Implementation-Title'    : project.name,
        'Implementation-Version'  : project.jar.archiveVersion,
        'MixinConfigs'            : 'alexs_egg_timer.mixins.json'
    ])
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
